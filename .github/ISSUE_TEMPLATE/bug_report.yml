name: Bug 报告
description: 脚本运行出错、答题异常或界面问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先确认脚本是最新版本（悬浮窗标题栏显示的版本号），并看一下 README 里的常见问题。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 前置检查
      options:
        - label: 我已搜索过现有 issues，没有找到相同的问题
          required: true
        - label: 脚本管理器里只启用了这一个 OCS（旧的「OCS 网课助手 AI 版」已删除）
          required: true

  - type: input
    id: version
    attributes:
      label: 脚本版本
      description: 悬浮窗标题栏 OCS 后面的版本号
      placeholder: "6.0.0"
    validations:
      required: true

  - type: dropdown
    id: site
    attributes:
      label: 网课平台
      options:
        - 超星学习通
        - 知到智慧树
        - 职教云 / 智慧职教
        - 中国大学MOOC
        - 雨课堂
        - 其他
    validations:
      required: true

  - type: dropdown
    id: page
    attributes:
      label: 出问题的页面
      options:
        - 章节测试
        - 作业
        - 考试
        - 视频 / 课程学习
        - 设置面板 / 界面
        - 其他
    validations:
      required: true

  - type: input
    id: answerer
    attributes:
      label: 答题来源
      description: 用的 AI 模型或固定题库名称；与答题无关的问题可以不填
      placeholder: "DeepSeek 官方，deepseek-v4.1-flash"

  - type: input
    id: environment
    attributes:
      label: 浏览器与脚本管理器
      placeholder: "Edge 141，Tampermonkey 5.4"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么，你期望的结果是什么
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开某门课的章节测试
        2. 等待自动答题
        3. 第 3 题显示红色……
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 悬浮窗工具栏「日志」页的内容，或 F12 控制台里的报错。贴之前请删掉 API Key。
      render: shell
